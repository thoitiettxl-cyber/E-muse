name: E-Muse Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for GitHub Release (leave empty to only upload artifact)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Verify phase wiring
        run: |
          git fetch --no-tags origin eta-parity || true
          bash scripts/verify-phase.sh

      - name: Restore release keystore
        env:
          EMUSE_KEYSTORE_BASE64: ${{ secrets.EMUSE_KEYSTORE_BASE64 }}
          EMUSE_KEYSTORE_PASSWORD: ${{ secrets.EMUSE_KEYSTORE_PASSWORD }}
          EMUSE_KEY_ALIAS: ${{ secrets.EMUSE_KEY_ALIAS }}
          EMUSE_KEY_PASSWORD: ${{ secrets.EMUSE_KEY_PASSWORD }}
        run: |
          if [[ -z "$EMUSE_KEYSTORE_BASE64" || -z "$EMUSE_KEYSTORE_PASSWORD" || \
                -z "$EMUSE_KEY_ALIAS" || -z "$EMUSE_KEY_PASSWORD" ]]; then
            echo "::error::Missing E-Muse release signing secrets (EMUSE_*)."
            exit 1
          fi
          printf '%s' "$EMUSE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/emuse-release.keystore"

      - name: Build Release APK
        env:
          EMUSE_KEYSTORE_FILE: ${{ runner.temp }}/emuse-release.keystore
          EMUSE_KEYSTORE_PASSWORD: ${{ secrets.EMUSE_KEYSTORE_PASSWORD }}
          EMUSE_KEY_ALIAS: ${{ secrets.EMUSE_KEY_ALIAS }}
          EMUSE_KEY_PASSWORD: ${{ secrets.EMUSE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease

      - name: Verify and stage APK
        id: apk
        run: |
          release_apk="app/build/outputs/apk/release/E-Muse-release.apk"
          output_dir="$RUNNER_TEMP/apks"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ! -f "$release_apk" ]]; then
            echo "::error::Release APK not found."
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$apksigner_path" verify "$release_apk"
          # The release must carry the E-Muse release certificate.
          expected_cert="33819fca1d830c15e1de2cb9a8a159ba22046700a48a166146a269baae64e2c0"
          if ! "$apksigner_path" verify --print-certs "$release_apk" \
              | grep -qi "certificate SHA-256 digest: $expected_cert"; then
            echo "::error::Release APK is not signed with the E-Muse release certificate."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/emuse-release.keystore"
          mkdir -p "$output_dir"
          cp "$release_apk" "$output_dir/E-Muse-release.apk"
          echo "release_path=$output_dir/E-Muse-release.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: E-Muse-release-apk
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: E-Muse ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: ${{ steps.apk.outputs.release_path }}
